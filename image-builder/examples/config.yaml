architecture: auto
hostname: robo

image:
  max_size_gb: 16
  reserve_gb: 2

packages:
  update: true
  prune: false
  keep:
    - systemd
    - coreutils
    - bash
    - sudo
    - openssh-server
    - netplan.io
    - network-manager
  extra:
    - curl

rustctl:
  enabled: true
  install_path: /rustctl/rustctl

files: []

tools: []

netplan:
  enabled: true
  renderer: NetworkManager
  configs:
    - source: ./netplan/10-robot.yaml
      destination: /etc/netplan/10-robot.yaml
      mode: "0600"

systemd:
  units:
    - source: ./systemd/rustctl.service
      destination: /etc/systemd/system/rustctl.service
      enabled: true
    - name: bluetooth.service
      state: disabled

hooks:
  mode: container
  after_packages:
    - ./hooks/configure-system.sh
  before_finalize: []

test:
  shell: false

guacamole:
  enabled: false
  username: root
  password: root
  ssh_host: host.docker.internal
  ssh_port: 22
  web_port: 2000
  bind_address: 127.0.0.1
  target_bind_address: 127.0.0.1
