# Starter: update the image, install rustctl, and keep existing packages.
architecture: auto
hostname: robo

image:
  max_size_gb: 16
  reserve_gb: 2

packages:
  update: true
  prune: false
  keep:
    - systemd
    - coreutils
    - bash
    - sudo
    - openssh-server
  extra:
    - avahi-daemon

rustctl:
  enabled: true
  install_path: /rustctl/rustctl

files: []
tools: []

netplan:
  enabled: true
  renderer: NetworkManager
  configs:
    - source: ./examples/netplan/10-robot.yaml
      destination: /etc/netplan/10-robot.yaml
      mode: "0600"

systemd:
  units:
    - source: ./examples/systemd/rustctl.service
      destination: /etc/systemd/system/rustctl.service
      enabled: true
    - name: avahi-daemon.service
      enabled: true

hooks:
  mode: container
  after_packages: []
  before_finalize: []

test:
  shell: false

guacamole:
  enabled: true
  # Accessible from the network; replace root/root before using on a shared LAN.
  username: root
  password: root
  ssh_host: host.docker.internal
  ssh_port: 22
  web_port: 2000
  bind_address: 127.0.0.1
  target_bind_address: 0.0.0.0 # Open on the Pi's Ethernet/Wi-Fi interfaces.
