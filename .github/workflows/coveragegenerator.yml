
name: Rust Code Coverage

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coverage:
    name: Update README coverage table
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage JSON
        working-directory: rustctl
        run: |
          cargo llvm-cov \
            --workspace \
            --all-features \
            --tests \
            --json \
            --output-path coverage.json \
            --ignore-run-fail || true

      - name: Update coverage table in README
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          coverage_file = Path("rustctl/coverage.json")
          readme_file = Path("README.md")

          start_marker = "<!-- COVERAGE-START -->"
          end_marker = "<!-- COVERAGE-END -->"

          if not coverage_file.exists():
              raise SystemExit("Coverage JSON was not created.")

          data = json.loads(coverage_file.read_text(encoding="utf-8"))
          report = data["data"][0]
          files = report.get("files", [])
          totals = report.get("totals", {})

          def percent(summary, key):
              metric = summary.get(key, {})
              count = metric.get("count", 0)
              covered = metric.get("covered", 0)
              return f"{covered / count * 100:.1f}%" if count else "N/A"

          rows = [
              "| File | Lines | Functions | Regions |",
              "|---|---:|---:|---:|",
          ]

          for item in sorted(files, key=lambda x: x["filename"]):
              filename = item["filename"].replace("\\", "/")

              if "/rustctl/" in filename:
                  filename = "rustctl/" + filename.rsplit("/rustctl/", 1)[1]
              else:
                  filename = Path(filename).name

              summary = item.get("summary", {})

              rows.append(
                  f"| `{filename}` "
                  f"| {percent(summary, 'lines')} "
                  f"| {percent(summary, 'functions')} "
                  f"| {percent(summary, 'regions')} |"
              )

          rows.extend([
              "",
              "**Overall:**",
              "",
              f"- Lines: **{percent(totals, 'lines')}**",
              f"- Functions: **{percent(totals, 'functions')}**",
              f"- Regions: **{percent(totals, 'regions')}**",
          ])

          readme = readme_file.read_text(encoding="utf-8")

          if start_marker not in readme or end_marker not in readme:
              raise SystemExit("Coverage markers missing in README.md")

          before, rest = readme.split(start_marker, 1)
          _, after = rest.split(end_marker, 1)

          updated = (
              before
              + start_marker
              + "\n"
              + "\n".join(rows)
              + "\n"
              + end_marker
              + after
          )

          readme_file.write_text(updated, encoding="utf-8")
          PY

      - name: Commit updated README
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"

          git add README.md

          if ! git diff --cached --quiet; then
            git commit -m "docs: update Rust coverage [skip ci]"
            git push
          else
            echo "README coverage has not changed."
          fi
