name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: cd rustctl && cargo build --verbose
    - name: Run tests
      run: |
        set -o pipefail
        cd rustctl
        cargo test --verbose 2>&1 | tee "$RUNNER_TEMP/rust-test.log"
    - name: Add test results to run summary
      if: always()
      run: |
        {
          echo '## Rust test results'
          echo
          if [ -f "$RUNNER_TEMP/rust-test.log" ]; then
            grep '^test result:' "$RUNNER_TEMP/rust-test.log" | sed 's/^/- `/; s/$/`/' || true
          else
            echo 'The test command did not produce a log.'
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Update rustctl test count badge
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        count=$(python3 - <<'PY'
        from pathlib import Path

        total = sum(path.read_text().count("#[test]") for path in Path("rustctl/tests").rglob("*.rs"))
        print(total)
        PY
        )
        printf '{"schemaVersion":1,"label":"unit tests","message":"%s","color":"orange"}\n' "$count" > rustctl-tests.json
        if git diff --quiet -- rustctl-tests.json; then
          echo "Test count unchanged: $count"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add rustctl-tests.json
        git commit -m "dynamic label refresh"
        git push

  check-hardware:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Check hardware feature
      run: cd rustctl && cargo check --all-targets --features hardware
