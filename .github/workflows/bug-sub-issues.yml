name: Link bug issues to Bugfixes

on:
  issues:
    types: [opened, reopened, labeled]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  link-bugs:
    if: github.event_name != 'issues' || github.event.action != 'labeled' || github.event.label.name == 'bug'
    runs-on: ubuntu-latest
    steps:
      - name: Add bug-labeled issues as sub-issues of #74
        env:
          GH_TOKEN: ${{ secrets.BUGFIXES_TOKEN || github.token }}
          REPOSITORY: ${{ github.repository }}
          PARENT_ISSUE: "74"
        shell: bash
        run: |
          set -euo pipefail

          endpoint="repos/${REPOSITORY}/issues/${PARENT_ISSUE}/sub_issues"
          existing="$(gh api --paginate "$endpoint?per_page=100" | jq -r '.[].number')"
          bugs="$(gh api --paginate "repos/${REPOSITORY}/issues?state=all&labels=bug&per_page=100" \
            | jq -r '.[] | select(.pull_request == null) | .number')"

          while IFS= read -r issue_number; do
            [[ -z "$issue_number" || "$issue_number" == "$PARENT_ISSUE" ]] && continue
            if grep -Fxq "$issue_number" <<< "$existing"; then
              echo "Issue #${issue_number} is already a sub-issue of #${PARENT_ISSUE}"
              continue
            fi

            echo "Linking bug issue #${issue_number} to #${PARENT_ISSUE}"
            if ! gh api --method POST "$endpoint" -F sub_issue_id="$issue_number" >/dev/null; then
              echo "::error::Could not add #${issue_number}. Ensure the workflow token has Issues: write permission. If repository or organization policy limits GITHUB_TOKEN, add a fine-grained PAT with Issues read/write for this repository as the BUGFIXES_TOKEN secret."
              exit 1
            fi
          done <<< "$bugs"
