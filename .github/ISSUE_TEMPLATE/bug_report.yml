name: Bug report
description: Report a reproducible problem with the software or robot arm
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not include credentials, private network details, or personal information.
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Include the exact error message or unexpected behavior.
      placeholder: Describe what you observed.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Build/run ...
        2. Enter ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Rust software / CLI
        - Web/API
        - Raspberry Pi / GPIO
        - Motor driver / wiring
        - Documentation
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: Paste the commit hash or release/version, if known.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Rust version, Pi model, and whether motors were connected.
      render: text
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I did not include secrets or sensitive personal information.
          required: true
