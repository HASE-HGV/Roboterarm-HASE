<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RoboArm Controller</title>
    <link rel="stylesheet" href="/assets/styles.css" />
</head>
  <body>
    <div id="status-banner" class="status-banner hidden"></div>

    <div class="container">
      <header>
        <h1>RoboArm Controller</h1>
        <div class="system-controls">
          <button onclick="powerOff()" class="btn btn-danger">Power Off</button>
          <button onclick="reboot()" class="btn btn-warning">Reboot</button>
        </div>
      </header>

      <div class="motors-grid">
        <div class="motor-card">
          <h2>Motor 1</h2>
          <div class="motor-controls">
            <div class="form-group">
              <label>Steps:</label>
              <input type="number" id="steps-1" value="200" min="1" />
            </div>
            <div class="form-group">
              <label>Step Delay (ms):</label>
              <input type="number" id="stepDelay-1" value="10" min="1" />
            </div>
            <div class="form-group">
              <label>Step Style:</label>
              <select id="stepStyle-1">
                <option value="single">Single</option>
                <option value="double">Double</option>
                <option value="interleave">Interleave</option>
                <option value="microstep">Microstep</option>
              </select>
            </div>
            <div class="direction-controls">
              <button onclick="runMotor(1, true)" class="btn btn-primary">Clockwise</button>
              <button onclick="runMotor(1, false)" class="btn btn-primary">Counter-CW</button>
            </div>
          </div>
        </div>

        <div class="motor-card">
          <h2>Motor 2</h2>
          <div class="motor-controls">
            <div class="form-group">
              <label>Steps:</label>
              <input type="number" id="steps-2" value="200" min="1" />
            </div>
            <div class="form-group">
              <label>Step Delay (ms):</label>
              <input type="number" id="stepDelay-2" value="10" min="1" />
            </div>
            <div class="form-group">
              <label>Step Style:</label>
              <select id="stepStyle-2">
                <option value="single">Single</option>
                <option value="double">Double</option>
                <option value="interleave">Interleave</option>
                <option value="microstep">Microstep</option>
              </select>
            </div>
            <div class="direction-controls">
              <button onclick="runMotor(2, true)" class="btn btn-primary">Clockwise</button>
              <button onclick="runMotor(2, false)" class="btn btn-primary">Counter-CW</button>
            </div>
          </div>
        </div>

        <div class="motor-card">
          <h2>Motor 3</h2>
          <div class="motor-controls">
            <div class="form-group">
              <label>Steps:</label>
              <input type="number" id="steps-3" value="200" min="1" />
            </div>
            <div class="form-group">
              <label>Step Delay (ms):</label>
              <input type="number" id="stepDelay-3" value="10" min="1" />
            </div>
            <div class="form-group">
              <label>Step Style:</label>
              <select id="stepStyle-3">
                <option value="single">Single</option>
                <option value="double">Double</option>
                <option value="interleave">Interleave</option>
                <option value="microstep">Microstep</option>
              </select>
            </div>
            <div class="direction-controls">
              <button onclick="runMotor(3, true)" class="btn btn-primary">Clockwise</button>
              <button onclick="runMotor(3, false)" class="btn btn-primary">Counter-CW</button>
            </div>
          </div>
        </div>

        <div class="motor-card">
          <h2>Motor 4</h2>
          <div class="motor-controls">
            <div class="form-group">
              <label>Steps:</label>
              <input type="number" id="steps-4" value="200" min="1" />
            </div>
            <div class="form-group">
              <label>Step Delay (ms):</label>
              <input type="number" id="stepDelay-4" value="10" min="1" />
            </div>
            <div class="form-group">
              <label>Step Style:</label>
              <select id="stepStyle-4">
                <option value="single">Single</option>
                <option value="double">Double</option>
                <option value="interleave">Interleave</option>
                <option value="microstep">Microstep</option>
              </select>
            </div>
            <div class="direction-controls">
              <button onclick="runMotor(4, true)" class="btn btn-primary">Clockwise</button>
              <button onclick="runMotor(4, false)" class="btn btn-primary">Counter-CW</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="/assets/script.js"></script>
  </body>
</html>
